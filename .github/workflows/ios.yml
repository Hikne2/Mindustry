name: Build Mindustry iOS

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x gradlew

      # 🔥 THIS IS THE MISSING PIECE
      - name: Clone Arc (required dependency)
        run: |
          cd ..
          git clone https://github.com/Anuken/Arc.git Arc

      - name: Pack assets
        run: ./gradlew pack

      - name: Build iOS IPA
        run: ./gradlew :ios:deploy -Probovm.iosSkipSigning=true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios
          path: |
            ios/build/**/*.ipa
            **/*.ipa
